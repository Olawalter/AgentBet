[tool.pytest.ini_options]
testpaths = ["tests/direct"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: hits the live network and takes minutes (integration only)",
]

[tool.coverage.run]
source = ["contracts"]
omit = ["tests/*"]
