<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- AgentBet mark: one commitment (the stake, filled) at the point where a
       claim forks into two outcomes. Capital sits at the fork, not on a branch. -->
  <rect width="32" height="32" fill="#08090A"/>
  <path d="M5 16 H14" stroke="#FF6B1A" stroke-width="2.4" stroke-linecap="square"/>
  <path d="M16.5 14.5 L27 7" stroke="#3FBF7F" stroke-width="2.4" stroke-linecap="square"/>
  <path d="M16.5 17.5 L27 25" stroke="#E0503F" stroke-width="2.4" stroke-linecap="square"/>
  <rect x="12.5" y="12.5" width="7" height="7" fill="#FF6B1A"/>
</svg>
